[project]
name = "nwu-mcp"
version = "0.1.0"
description = "西北大学正方教务系统 MCP 服务器：课表、成绩、考试安排、空闲教室与消息通知，纯 HTTP 自动登录。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "pycryptodome>=3.20.0",
]

[project.scripts]
nwu-mcp = "nwu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwu_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
